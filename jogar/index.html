<html lang="pt-BR">

    <title>Farmeiro | Primeira safra</title>
    <link rel="icon" href="assets/marca.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css?v=1dd786490335" />
    <link rel="stylesheet" href="colheitadeira.css?v=6ad8cabf051a" />
    <link rel="stylesheet" href="caminhao.css?v=6deca9695f35" />
    <script type="importmap">
      {
        "imports": {
          "farmeiro/cabine": "./art/cabine-3d.mjs?v=1051b1e507fc",
          "farmeiro/caminhao": "./art/caminhao-3d.mjs?v=1d1004fec2f3",

          "three/addons/": "./assets/vendor/three-0.187.0/examples/jsm/"
        }
      }
    </script>

  <body>
    <header id="top"></header>
    <div id="shell">
      <nav id="rail" aria-label="Navegação da fazenda"></nav>
      <main>
        <div id="heading"></div>
        <div id="layout">
          <section id="territory" aria-label="Mapa estratégico">
            <div id="map">
              <div id="viewport">
                <div id="world">
                  <img
                    id="terrain"
                    src="assets/mapa.webp"
                    alt="Vista aérea da região agrícola, com talhões, estradas, sedes e reservatórios"
                    draggable="false"
                  />
                  <canvas id="crops" aria-hidden="true"></canvas>
                  <div id="pins"></div>
                </div>
              </div>
              <div id="map-caption"></div>
              <div id="weather"></div>
              <div id="cartography"></div>
              <div id="map-tools"></div>
            </div>
            <div id="below"></div>
          </section>
          <div id="field-desk">
            <aside id="notebook" aria-label="Caderno de campo"></aside>
            <section id="home-stories" aria-label="Desafios da safra" hidden></section>
          </div>
        </div>
      </main>
    </div>
    <dialog id="dialog"><div id="dialog-content"></div></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <noscript>Ative o JavaScript para jogar a primeira safra.</noscript>

    <script src="game.js?v=f8aa1b930a6f"></script>
    <script src="panels.js?v=560cb73c9718"></script>
    <script src="colheitadeira.js?v=ad959fda68c2"></script>
    <script src="caminhao.js?v=50b3c1eab5b5"></script>
